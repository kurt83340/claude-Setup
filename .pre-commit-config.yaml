# Garde-fou secrets AVANT chaque commit (gitleaks) — stack-neutre.
# Activer une fois par clone :  pipx install pre-commit && pre-commit install
#                         (ou :  uv tool install pre-commit && pre-commit install)
# Scanner tout l'historique :   pre-commit run gitleaks-tout --hook-stage manual
#   ⚠️ PAS `pre-commit run --all-files` : le hook de commit ne lit que l'index (--staged) — index vide = « Passed » sans rien lire
# Ajoute ici les hooks de ta stack (ruff, eslint…) — voir https://pre-commit.com/hooks.html
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-tout
        name: Detect hardcoded secrets (tout l'historique git)
        entry: gitleaks git --redact --verbose
        stages: [manual]
        always_run: true
